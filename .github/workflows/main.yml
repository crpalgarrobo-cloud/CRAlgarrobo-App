name: Build APK CRAlgarrobo

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Esto permite ejecutarlo manualmente si fuera necesario

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Cordova
        run: npm install -g cordova

      - name: Preparar y Construir APK
        run: |
          # Entramos en la carpeta que subiste a GitHub
          cd app-comuneros
          
          # Añadimos la plataforma Android
          cordova platform add android
          
          # Construimos la APK en modo debug (la más sencilla para compartir)
          cordova build android --debug

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: APK-CRAlgarrobo-Instalable
          path: app-comuneros/platforms/android/app/build/outputs/apk/debug/app-debug.apk
